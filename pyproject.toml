[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-daily-content-agent"
version = "0.1.0"
description = "Autonomous, source-grounded AI news and concept publishing pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AI Daily Content Agent contributors" }]
dependencies = [
  "apscheduler>=3.10.4,<4",
  "beautifulsoup4>=4.12.3,<5",
  "fastapi>=0.115.0,<1",
  "feedparser>=6.0.11,<7",
  "httpx>=0.27.2,<1",
  "pydantic>=2.9.2,<3",
  "pydantic-settings>=2.5.2,<3",
  "python-dateutil>=2.9.0.post0,<3",
  "sqlalchemy>=2.0.35,<3",
  "uvicorn[standard]>=0.30.6,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3,<9",
  "pytest-asyncio>=0.24.0,<1",
  "pytest-cov>=5.0.0,<6",
  "respx>=0.21.1,<1",
  "ruff>=0.6.9,<1",
]

[project.scripts]
ai-content-agent = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
